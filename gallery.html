<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Gallery page -->
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | F1 Racing</title>
  <!-- Bootstrap CSS -->
  <link href="vendor/bootstrap.min.css" rel="stylesheet">
  <!-- My CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/paddock.css">
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <script>window.jQuery || document.write('<script src="vendor/jquery-4.0.0.min.js"><\/script>');</script>
  <script src="js/script.js"></script>
</head>
<body>
  <div id="scroll-progress" aria-hidden="true"></div>

  <header>
    <nav class="navbar navbar-expand-lg bg-black" data-bs-theme="dark">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="index.html">F1 RACING</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto main-nav">
            <li class="nav-item"><a class="nav-link fw-bold" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link fw-bold" href="index.html#drivers">Drivers</a></li>
            <li class="nav-item"><a class="nav-link fw-bold" href="teams.html">Teams</a></li>
            <li class="nav-item"><a class="nav-link fw-bold active" aria-current="page" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link fw-bold" href="fan-zone.html">Fan zone</a></li>
            <li class="nav-item"><a class="nav-link fw-bold" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <div class="container-fluid">
    <div class="row">

      <main class="col-12 site-main py-4 px-3 px-lg-5">
        <h1>Gallery</h1>
        <p class="lead mb-4">All photos of our drivers in one place.</p>

        <section class="card mb-5" aria-labelledby="featured-heading">
          <div class="card-body p-4">
            <h2 id="featured-heading">Featured photo</h2>
            <p>Choose a thumbnail to change the large photo.</p>
            <img id="featured-photo" src="images/Max1.jpg" class="featured-photo rounded" alt="Max Verstappen">
            <p id="featured-caption" class="mt-2 mb-3">Max Verstappen</p>
            <div class="gallery-thumbs" role="group" aria-label="Choose a featured photo">
              <button class="gallery-thumb selected" type="button" data-image="images/Max1.jpg" data-caption="Max Verstappen" aria-pressed="true" aria-label="Show Max Verstappen">
                <img src="images/Max1.jpg" alt="">
              </button>
              <button class="gallery-thumb" type="button" data-image="images/Kimi3.jpg" data-caption="Kimi Antonelli" aria-pressed="false" aria-label="Show Kimi Antonelli">
                <img src="images/Kimi3.jpg" alt="">
              </button>
              <button class="gallery-thumb" type="button" data-image="images/Michael1.jpg" data-caption="Michael Schumacher" aria-pressed="false" aria-label="Show Michael Schumacher">
                <img src="images/Michael1.jpg" alt="">
              </button>
              <button class="gallery-thumb" type="button" data-image="images/f1-grid.jpg" data-caption="Race start" aria-pressed="false" aria-label="Show race start">
                <img src="images/f1-grid.jpg" alt="">
              </button>
            </div>
          </div>
        </section>

        <!-- All photos: 2 in a row on phones, 3 in a row from tablets -->
        <h2 class="mb-3">All photos</h2>
        <div class="row g-3">
          <div class="col-6 col-md-4"><img data-src="images/Max1.jpg" class="img-fluid rounded w-100 photo" alt="Max Verstappen"></div>
          <div class="col-6 col-md-4"><img data-src="images/Max2.jpg" class="img-fluid rounded w-100 photo" alt="Max Verstappen celebrating"></div>
          <div class="col-6 col-md-4"><img data-src="images/Max3.jpg" class="img-fluid rounded w-100 photo" alt="Max Verstappen winner poster"></div>
          <div class="col-6 col-md-4"><img data-src="images/Kimi1.jpg" class="img-fluid rounded w-100 photo" alt="Kimi Antonelli in the paddock"></div>
          <div class="col-6 col-md-4"><img data-src="images/Kimi2.jpg" class="img-fluid rounded w-100 photo" alt="Kimi Antonelli signing autographs"></div>
          <div class="col-6 col-md-4"><img data-src="images/Kimi3.jpg" class="img-fluid rounded w-100 photo" alt="Kimi Antonelli"></div>
          <div class="col-6 col-md-4"><img data-src="images/Michael1.jpg" class="img-fluid rounded w-100 photo" alt="Michael Schumacher"></div>
          <div class="col-6 col-md-4"><img data-src="images/Michael2.jpg" class="img-fluid rounded w-100 photo" alt="Michael Schumacher celebrating on his Ferrari"></div>
          <div class="col-6 col-md-4"><img data-src="images/Michael3.jpg" class="img-fluid rounded w-100 photo" alt="Michael Schumacher driving a Ferrari"></div>
        </div>
      </main>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">Team members: Dinmukhamed Tamdybek and Asylzhan Abdukadirov</p>
  </footer>

  <!-- Bootstrap JavaScript for the mobile navigation -->
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
